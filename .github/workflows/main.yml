name: Build radare2 + r2ghidra for Termux (arm)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          fetch-depth: 1

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Fetch upstream version & update radare2 build spec
        run: |
          set -euo pipefail

          # Shallow clone radare2 master to extract base version and git commit date
          git clone --depth=1 https://github.com/radareorg/radare2.git /tmp/radare2-src

          # Extract clean semver sequentially to avoid grep outputting file path prefixes
          R2_BASE_VER=""
          if [ -f /tmp/radare2-src/meson.build ]; then
            R2_BASE_VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/radare2-src/meson.build | head -n 1)
          fi
          if [ -z "$R2_BASE_VER" ] && [ -f /tmp/radare2-src/configure.acr ]; then
            R2_BASE_VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/radare2-src/configure.acr | head -n 1)
          fi
          if [ -z "$R2_BASE_VER" ]; then
            R2_BASE_VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' packages/radare2/build.sh | head -n 1)
          fi
          if [ -z "$R2_BASE_VER" ]; then R2_BASE_VER="6.0.0"; fi

          GIT_DATE=$(git -C /tmp/radare2-src log -1 --format=%cd --date=format:'%Y%m%d')
          R2_FULL_VER="${R2_BASE_VER}+git${GIT_DATE}"

          # Ensure strictly safe version string formatting
          R2_BASE_VER=$(echo "$R2_BASE_VER" | tr -cd '0-9.')
          R2_FULL_VER=$(echo "$R2_FULL_VER" | tr -cd '0-9a-zA-Z+.')

          echo "R2_BASE_VER=${R2_BASE_VER}" >> $GITHUB_ENV
          echo "R2_FULL_VER=${R2_FULL_VER}" >> $GITHUB_ENV

          # Patch radare2 build.sh with exact version tag and master git source
          sed -i \
            -e "s|^TERMUX_PKG_VERSION=.*|TERMUX_PKG_VERSION=\"${R2_FULL_VER}\"|" \
            -e 's|^TERMUX_PKG_SRCURL=.*|TERMUX_PKG_SRCURL=git+https://github.com/radareorg/radare2.git|' \
            -e 's|^TERMUX_PKG_SHA256=.*|TERMUX_PKG_SHA256=SKIP_CHECKSUM|' \
            packages/radare2/build.sh
          echo 'TERMUX_PKG_GIT_BRANCH=master' >> packages/radare2/build.sh

          rm -rf /tmp/radare2-src

      - name: Build dependencies and radare2
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a arm -I libuv libandroid-spawn radare2

      - name: Pre-fetch r2ghidra and compile native sleighc
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y meson ninja-build

          git clone --depth=1 -b master https://github.com/radareorg/r2ghidra.git packages/r2ghidra/git-src

          cd packages/r2ghidra/git-src
          meson subprojects download

          cd subprojects/ghidra-native
          meson setup build-native --prefer-static
          ninja -C build-native sleighc

          SLEIGHC_BIN=$(find build-native -type f -name sleighc -executable | head -n 1)
          cp "$SLEIGHC_BIN" ../../../sleighc-native
          chmod +x ../../../sleighc-native

      - name: Define local r2ghidra package
        run: |
          set -euo pipefail
          mkdir -p packages/r2ghidra

          cat > packages/r2ghidra/build.sh <<'EOF'
          TERMUX_PKG_HOMEPAGE=https://github.com/radareorg/r2ghidra
          TERMUX_PKG_DESCRIPTION="Ghidra decompiler plugin for radare2"
          TERMUX_PKG_LICENSE="LGPL-3.0"
          TERMUX_PKG_MAINTAINER="@you"

          TERMUX_PKG_VERSION="@R2_FULL_VER@"
          TERMUX_PKG_SRCURL=git+https://github.com/radareorg/r2ghidra.git
          TERMUX_PKG_SHA256=SKIP_CHECKSUM
          TERMUX_PKG_GIT_BRANCH=master

          TERMUX_PKG_DEPENDS="radare2, zlib"

          termux_step_get_source() {
            rm -rf "$TERMUX_PKG_SRCDIR"
            cp -a "$TERMUX_PKG_BUILDER_DIR/git-src" "$TERMUX_PKG_SRCDIR"
          }

          termux_step_pre_configure() {
            rm -f "$TERMUX_PKG_SRCDIR/configure"

            python3 -c '
          import sys
          path = sys.argv[1]
          native_bin = sys.argv[2]
          with open(path, "r") as f:
              lines = f.readlines()
          lines.insert(1, f"import sys\nsys.argv[1] = \"{native_bin}\"\n")
          with open(path, "w") as f:
              f.writelines(lines)
          ' "$TERMUX_PKG_SRCDIR/ghidra/sleigh_compile.py" "$TERMUX_PKG_BUILDER_DIR/sleighc-native"

            local shim_dir="$TERMUX_PKG_BUILDDIR/r2-shim"
            mkdir -p "$shim_dir"

            local libr_plugins="$TERMUX_PREFIX/lib/radare2/@R2_BASE_VER@"

            cat > "$shim_dir/r2" <<SHIM_EOF
          #!/bin/sh
          if [ "\$1" = "-H" ]; then
            case "\$2" in
              R2_PREFIX) echo "$TERMUX_PREFIX" ;;
              R2_LIBR_PLUGINS) echo "$libr_plugins" ;;
              R2_USER_PLUGINS) echo "$TERMUX_PREFIX/../home/.local/share/radare2/plugins" ;;
              R2_LIBEXT) echo "so" ;;
              *) echo "" ;;
            esac
            exit 0
          fi
          if [ "\$1" = "-qv" ] || [ "\$1" = "-v" ] || [ "\$1" = "-V" ]; then
            echo "@R2_BASE_VER@"
            exit 0
          fi
          exit 0
          SHIM_EOF
            chmod +x "$shim_dir/r2"
            ln -s r2 "$shim_dir/radare2"

            export PATH="$shim_dir:$PATH"
          }

          termux_step_post_make_install() {
            local DEST_DIR="$TERMUX_PREFIX/lib/radare2/@R2_BASE_VER@"
            mkdir -p "$DEST_DIR"

            local PLUGIN_FILE=$(find "$TERMUX_PREFIX" -name '*core*r2ghidra.so' -o -name '*core_ghidra.so' 2>/dev/null | head -n 1)
            if [ -n "$PLUGIN_FILE" ]; then
              mv "$PLUGIN_FILE" "$DEST_DIR/core_ghidra.so"
            fi

            local SLEIGH_DIR=$(find "$TERMUX_PREFIX" -type d -name 'r2ghidra_sleigh' 2>/devnull | head -n 1)
            if [ -n "$SLEIGH_DIR" ] && [ "$SLEIGH_DIR" != "$DEST_DIR/r2ghidra_sleigh" ]; then
              mv "$SLEIGH_DIR" "$DEST_DIR/r2ghidra_sleigh"
            fi
          }
          EOF

          sed -i \
            -e "s|@R2_BASE_VER@|${R2_BASE_VER}|g" \
            -e "s|@R2_FULL_VER@|${R2_FULL_VER}|g" \
            packages/r2ghidra/build.sh

      - name: Build r2ghidra
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a arm -I r2ghidra

      - name: Upload built .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radare2-and-r2ghidra-termux-arm
          path: output/*.deb
          if-no-files-found: error
